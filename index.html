    <script>
      // Runs before first paint: restore the saved theme and decide whether
      // the boot sequence plays (once per tab, never with reduced motion).
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var t = JSON.parse(localStorage.getItem('sxi9-theme') || 'null');
          if (t && t.name) {
            d.dataset.palette = t.name;
            ['ink', 'hot', 'cool', 'bg'].forEach(function (k) {
              if (/^#[0-9a-f]{6}$/i.test(t[k])) d.style.setProperty('--' + k, t[k]);
            });
          }
          var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
          // the boot sequence belongs to the home page only
          if (!calm && !d.dataset.page && !sessionStorage.getItem('sxi9-booted')) d.classList.add('booting');
        } catch (e) {}
        // If the main script never arrives, do not leave the page hidden
        // behind the boot screen or its scroll-in animations.
        setTimeout(function () {
          if (!window.__sxi9) {
            d.classList.remove('booting');
            d.classList.add('no-reveal');
          }
        }, 4000);
      })();
    </script>
